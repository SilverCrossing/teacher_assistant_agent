[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "teacher-grading-assistant"
version = "0.1.0"
description = "Local, read-only grading assistant with evidence-based draft review"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3",
  "httpx>=0.28,<1", "cryptography>=44,<47", "keyring>=25,<26",
  "playwright>=1.51,<2",
  "pypdf>=6.21.1,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
grading-assistant = "grading_assistant.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
